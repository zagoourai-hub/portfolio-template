services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student-portfolio
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/databases/dev.db
      - SESSION_SECRET=super-secret-session-key-must-be-at-least-32-chars-long-change-this
      - ADMIN_EMAIL=owner@example.com
      - ADMIN_PASSWORD=superpassword123
      - NODE_ENV=production
    volumes:
      - ./databases:/databases
